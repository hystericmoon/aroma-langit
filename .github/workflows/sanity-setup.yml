# One-off: loads the bundled content into Sanity and deploys the Studio.
# Runs when this file is pushed, then is deleted in the next commit.
# Secret: SANITY_AUTH_TOKEN (Editor). It is only passed as an env var to the CLI steps,
# GitHub masks it in logs, and no step echoes it or runs with `set -x`.
name: Sanity setup (one-off)

on:
  push:
    branches: [feat/astro-sanity-rebuild]
    paths: [.github/workflows/sanity-setup.yml]

permissions:
  contents: read
  actions: write # to start the staging deploy once the content is in

env:
  PROJECT_ID: eo2zthve
  DATASET: production

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            studio/package-lock.json

      - name: Install
        run: |
          npm ci
          cd studio && npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Write the seed
        run: npm run seed

      # Each Sanity step keeps its output in a file and, on failure, turns the last lines
      # into an error annotation so the cause shows without opening the log.
      - name: Import into the production dataset
        id: import
        working-directory: studio
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          SANITY_IMPORT_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: |
          if [ -z "$SANITY_AUTH_TOKEN" ]; then echo "::error title=Import::SANITY_AUTH_TOKEN is empty"; exit 1; fi
          if npx sanity dataset import seed/aroma-langit.ndjson --project-id "$PROJECT_ID" --dataset "$DATASET" --replace > ../import.log 2>&1; then
            echo "::notice title=Import::$(tail -n 3 ../import.log | tr '\n' ' ')"
          else
            echo "::error title=Import failed::$(tail -n 15 ../import.log | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi

      - name: Check the dataset is publicly readable
        run: |
          q='{"services":count(*[_type=="service"]),"presets":count(*[_type=="calculatorPreset"]),"settings":count(*[_id=="siteSettings"]),"images":count(*[_type=="sanity.imageAsset"])}'
          res=$(curl -fsS -G "https://$PROJECT_ID.api.sanity.io/v2025-01-01/data/query/$DATASET" --data-urlencode "query=$q")
          echo "::notice title=Public read::$res"
          echo "$res" | grep -q '"services":0' && { echo "::error title=Public read::No services visible without a token. Is the dataset private?"; exit 1; } || true

      - name: Deploy the Studio
        working-directory: studio
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: |
          for host in aromalangit aroma-langit aromalangit-studio; do
            if npx sanity deploy -y --url "$host" > ../deploy.log 2>&1; then
              echo "::notice title=Studio deployed::https://$host.sanity.studio"
              exit 0
            fi
            echo "::warning title=Studio host $host::$(tail -n 8 ../deploy.log | tr '\n' ' ' | cut -c1-600)"
          done
          echo "::error title=Studio deploy failed::$(tail -n 15 ../deploy.log | tr '\n' ' ' | cut -c1-900)"
          exit 1

      - name: Rebuild staging from Sanity
        if: ${{ !cancelled() && steps.import.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-staging.yml --ref "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
